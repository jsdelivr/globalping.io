<div class="c-gp-globe {{className}}" aria-hidden="true">
	<video class="c-gp-globe_video"
		autoplay
		loop
		muted
		playsinline
		preload="metadata"
		style="background: center / contain no-repeat url('{{@shared.assetsHost}}/img/globe-poster.webp')"
		poster="{{@shared.assetsHost}}/img/globe-poster.webp">
		<source src="{{@shared.assetsHost}}/img/globe-video.webm" type="video/webm">
	</video>
</div>

<script>
	const { addManagedListener } = require('../../assets/js/utils/listeners');

	component.exports = {
		onrender () {
			if (Ractive.isServer) {
				return;
			}

			let globeVideo = this.find('.c-gp-globe_video');
			let prefersReducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

			let handleReducedMotionChange = (event) => {
				if (event.matches) {
					globeVideo.pause();
					return;
				}

				globeVideo.play().catch(() => {});
			};

			handleReducedMotionChange(prefersReducedMotionQuery);
			addManagedListener(this, prefersReducedMotionQuery, 'change', handleReducedMotionChange);
		},
	};
</script>
