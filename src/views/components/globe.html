<div class="c-gp-globe {{className}}" aria-hidden="true">
	<svg viewBox="0 0 1200 1200" role="presentation" focusable="false">
		<defs>
			<clipPath id="{{clipPathId}}">
				<circle cx="600" cy="600" r="560"></circle>
			</clipPath>

			<filter id="{{pulseFilterId}}" x="-200%" y="-200%" width="400%" height="400%">
				<feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"></feGaussianBlur>
				<feMerge>
					<feMergeNode in="blur"></feMergeNode>
					<feMergeNode in="SourceGraphic"></feMergeNode>
				</feMerge>
			</filter>
		</defs>

		<circle class="c-gp-globe_shell" cx="600" cy="600" r="560"></circle>
		<g class="c-gp-globe_base-dots" clip-path="url(#{{clipPathId}})"></g>
		<g class="c-gp-globe_pulse-dots" clip-path="url(#{{clipPathId}})" filter="url(#{{pulseFilterId}})"></g>
		<circle class="c-gp-globe_outline" cx="600" cy="600" r="560"></circle>
	</svg>
</div>

<script>
	const packedGlobeDots = require('../../assets/json/globe-dots.json');
	const { addManagedListener } = require('../../assets/js/utils/listeners');

	const SVG_NS = 'http://www.w3.org/2000/svg';
	const DEG_TO_RAD = Math.PI / 180;
	const TAU = Math.PI * 2;
	const GLOBE_CENTER = 600;
	const GLOBE_RADIUS = 560;
	const GLOBE_TILT = -4 * DEG_TO_RAD;
	const GLOBE_TILT_SIN = Math.sin(GLOBE_TILT);
	const GLOBE_TILT_COS = Math.cos(GLOBE_TILT);
	const INITIAL_ROTATION = 90 * DEG_TO_RAD;
	const ROTATION_SPEED = -.00004;
	const MIN_DOT_OPACITY = .35;
	const MAX_DOT_OPACITY = .95;
	const DOT_OPACITY_RANGE = MAX_DOT_OPACITY - MIN_DOT_OPACITY;
	const MIN_DOT_RADIUS = 1.22;
	const MAX_DOT_RADIUS = 2.22;
	const DOT_RADIUS_RANGE = MAX_DOT_RADIUS - MIN_DOT_RADIUS;
	const PULSE_COUNT = 5;
	const PULSE_DURATION_MIN = 1400;
	const PULSE_DURATION_MAX = 2600;
	const PULSE_DEPTH_THRESHOLD = .16;
	const DEFAULT_VISIBLE_ROWS_PERCENT = 1;

	const clampVisibleRowsPercent = (value) => {
		let percent = Number(value);

		if (!Number.isFinite(percent)) {
			return DEFAULT_VISIBLE_ROWS_PERCENT;
		}

		if (percent > 1) {
			percent /= 100;
		}

		return Math.max(0, Math.min(percent, 1));
	};

	const getVisiblePackedRows = ({ lat0, lon0, step, rows }, visibleRowsPercent) => {
		let visiblePercent = clampVisibleRowsPercent(visibleRowsPercent);
		let visibleRowCount = Math.ceil(rows.length * visiblePercent);
		let startRowIndex = Math.max(rows.length - visibleRowCount, 0);

		return {
			lat0: lat0 + (startRowIndex * step),
			lon0,
			step,
			rows: rows.slice(startRowIndex),
		};
	};

	const unpackGlobeDots = ({ lat0, lon0, step, rows }) => {
		let dotCount = rows.reduce((count, runs) => {
			for (let runIndex = 0; runIndex < runs.length; runIndex += 2) {
				count += runs[runIndex + 1];
			}

			return count;
		}, 0);
		let sinLongitudes = new Float32Array(dotCount);
		let cosLongitudes = new Float32Array(dotCount);
		let sinLatitudes = new Float32Array(dotCount);
		let cosLatitudes = new Float32Array(dotCount);
		let longitudeBase = lon0 * DEG_TO_RAD;
		let longitudeStep = step * DEG_TO_RAD;
		let dotIndex = 0;

		for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
			let runs = rows[rowIndex];
			let latitude = (lat0 + (rowIndex * step)) * DEG_TO_RAD;
			let sinLatitude = Math.sin(latitude);
			let cosLatitude = Math.cos(latitude);

			for (let runIndex = 0; runIndex < runs.length; runIndex += 2) {
				let start = runs[runIndex];
				let length = runs[runIndex + 1];

				for (let column = start; column < start + length; column++) {
					let longitude = longitudeBase + (column * longitudeStep);

					sinLongitudes[dotIndex] = Math.sin(longitude);
					cosLongitudes[dotIndex] = Math.cos(longitude);
					sinLatitudes[dotIndex] = sinLatitude;
					cosLatitudes[dotIndex] = cosLatitude;
					dotIndex++;
				}
			}
		}

		return {
			count: dotCount,
			sinLongitudes,
			cosLongitudes,
			sinLatitudes,
			cosLatitudes,
		};
	};

	const createCircleNode = (className) => {
		let circle = document.createElementNS(SVG_NS, 'circle');
		circle.setAttribute('class', className);
		circle.style.display = 'none';
		return circle;
	};

	const randomBetween = (min, max) => min + (Math.random() * (max - min));

	component.exports = {
		data () {
			let instanceId = `gp-globe-${Math.random().toString(36).slice(2, 10)}`;

			return {
				clipPathId: `${instanceId}-clip`,
				pulseFilterId: `${instanceId}-pulse`,
				visibleRowsPercent: DEFAULT_VISIBLE_ROWS_PERCENT,
			};
		},
		onrender () {
			if (Ractive.isServer) {
				return;
			}

			this._globeElement = this.find('.c-gp-globe');
			this._baseDotsGroup = this.find('.c-gp-globe_base-dots');
			this._pulseDotsGroup = this.find('.c-gp-globe_pulse-dots');
			this._globeDots = unpackGlobeDots(getVisiblePackedRows(packedGlobeDots, this.get('visibleRowsPercent')));
			this._prefersReducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
			this._prefersReducedMotion = this._prefersReducedMotionQuery.matches;
			this._globeRotation = INITIAL_ROTATION;
			this._globePulseStates = Array.from({ length: PULSE_COUNT }, () => null);
			this._projectedX = new Float32Array(this._globeDots.count);
			this._projectedY = new Float32Array(this._globeDots.count);
			this._projectedDepth = new Float32Array(this._globeDots.count);
			this._projectedRadius = new Float32Array(this._globeDots.count);
			this._visibleDotIndices = new Uint32Array(this._globeDots.count);
			this._baseDotVisible = new Array(this._globeDots.count).fill(false);
			this._pulseDotVisible = new Array(PULSE_COUNT).fill(false);
			this._isInViewport = true;
			this._isRenderedVisible = this.isRenderable();
			this._animateGlobe = this.animateGlobe.bind(this);
			this._handleVisibilityChange = this.handleVisibilityChange.bind(this);
			this._handleResize = this.handleResize.bind(this);
			this._handleReducedMotionChange = this.handleReducedMotionChange.bind(this);

			let baseDotsFragment = document.createDocumentFragment();
			this._baseDotNodes = Array.from({ length: this._globeDots.count }, () => {
				let circle = createCircleNode('c-gp-globe_dot');
				baseDotsFragment.appendChild(circle);
				return circle;
			});

			this._baseDotsGroup.appendChild(baseDotsFragment);

			let pulseDotsFragment = document.createDocumentFragment();
			this._pulseDotNodes = Array.from({ length: PULSE_COUNT }, () => {
				let circle = createCircleNode('c-gp-globe_pulse-dot');
				pulseDotsFragment.appendChild(circle);
				return circle;
			});

			this._pulseDotsGroup.appendChild(pulseDotsFragment);

			addManagedListener(this, document, 'visibilitychange', this._handleVisibilityChange);
			addManagedListener(this, window, 'resize', this._handleResize);
			addManagedListener(this, this._prefersReducedMotionQuery, 'change', this._handleReducedMotionChange);

			if ('IntersectionObserver' in window) {
				this._intersectionObserver = new IntersectionObserver(this.handleIntersection.bind(this), {
					threshold: 0,
				});

				this._intersectionObserver.observe(this._globeElement);
			}

			this.renderFrame(performance.now());

			if (this.shouldAnimate()) {
				this.startAnimation();
			}
		},
		onunrender () {
			this.stopAnimation();
			this._intersectionObserver?.disconnect();
		},
		isRenderable () {
			return this._globeElement ? this._globeElement.getClientRects().length > 0 : false;
		},
		shouldAnimate () {
			return !this._prefersReducedMotion && !document.hidden && this._isInViewport && this._isRenderedVisible;
		},
		handleVisibilityChange () {
			if (this.shouldAnimate()) {
				this.startAnimation();
				return;
			}

			this.stopAnimation();
		},
		handleResize () {
			this._isRenderedVisible = this.isRenderable();
			this.handleVisibilityChange();
		},
		handleReducedMotionChange (event) {
			this._prefersReducedMotion = event.matches;
			this.handleVisibilityChange();
		},
		handleIntersection (entries) {
			this._isInViewport = entries.some(entry => entry.isIntersecting);
			this._isRenderedVisible = this.isRenderable();
			this.handleVisibilityChange();
		},
		startAnimation () {
			if (this._globeAnimationFrame || !this.shouldAnimate()) {
				return;
			}

			this._lastAnimationFrameAt = null;
			this._globeAnimationFrame = requestAnimationFrame(this._animateGlobe);
		},
		stopAnimation () {
			if (!this._globeAnimationFrame) {
				return;
			}

			cancelAnimationFrame(this._globeAnimationFrame);
			this._globeAnimationFrame = null;
			this._lastAnimationFrameAt = null;
		},
		animateGlobe (now) {
			if (!this._lastAnimationFrameAt) {
				this._lastAnimationFrameAt = now;
			}

			let elapsed = Math.min(now - this._lastAnimationFrameAt, 32);
			this._lastAnimationFrameAt = now;
			this._globeRotation = (this._globeRotation + (elapsed * ROTATION_SPEED) + TAU) % TAU;
			this.renderFrame(now);
			this._globeAnimationFrame = requestAnimationFrame(this._animateGlobe);
		},
		createPulseState (now, visibleDotCount, activePulseIndices) {
			if (!visibleDotCount) {
				return null;
			}

			let startIndex = Math.floor(Math.random() * visibleDotCount);

			for (let offset = 0; offset < visibleDotCount; offset++) {
				let dotIndex = this._visibleDotIndices[(startIndex + offset) % visibleDotCount];

				if (this._projectedDepth[dotIndex] <= PULSE_DEPTH_THRESHOLD || activePulseIndices.has(dotIndex)) {
					continue;
				}

				activePulseIndices.add(dotIndex);

				return {
					dotIndex,
					startAt: now,
					duration: randomBetween(PULSE_DURATION_MIN, PULSE_DURATION_MAX),
				};
			}

			return null;
		},
		renderFrame (now) {
			let { sinLongitudes, cosLongitudes, sinLatitudes, cosLatitudes, count } = this._globeDots;
			let sinRotation = Math.sin(this._globeRotation);
			let cosRotation = Math.cos(this._globeRotation);
			let visibleDotCount = 0;

			for (let index = 0; index < count; index++) {
				let sinLongitude = (sinLongitudes[index] * cosRotation) + (cosLongitudes[index] * sinRotation);
				let cosLongitude = (cosLongitudes[index] * cosRotation) - (sinLongitudes[index] * sinRotation);
				let x = cosLatitudes[index] * sinLongitude;
				let y = (sinLatitudes[index] * GLOBE_TILT_COS) - (cosLatitudes[index] * cosLongitude * GLOBE_TILT_SIN);
				let depth = (sinLatitudes[index] * GLOBE_TILT_SIN) + (cosLatitudes[index] * cosLongitude * GLOBE_TILT_COS);
				let circle = this._baseDotNodes[index];

				if (depth <= 0) {
					this._projectedDepth[index] = 0;

					if (this._baseDotVisible[index]) {
						circle.style.display = 'none';
						this._baseDotVisible[index] = false;
					}

					continue;
				}

				this._projectedX[index] = GLOBE_CENTER + (GLOBE_RADIUS * x);
				this._projectedY[index] = GLOBE_CENTER - (GLOBE_RADIUS * y);
				this._projectedDepth[index] = depth;
				this._projectedRadius[index] = MIN_DOT_RADIUS + (DOT_RADIUS_RANGE * depth);
				this._visibleDotIndices[visibleDotCount] = index;
				visibleDotCount++;

				if (!this._baseDotVisible[index]) {
					circle.style.display = '';
					this._baseDotVisible[index] = true;
				}

				circle.cx.baseVal.value = this._projectedX[index];
				circle.cy.baseVal.value = this._projectedY[index];
				circle.r.baseVal.value = this._projectedRadius[index];
				circle.style.fillOpacity = MIN_DOT_OPACITY + (DOT_OPACITY_RANGE * depth);
			}

			this.renderPulseDots(now, visibleDotCount);
		},
		renderPulseDots (now, visibleDotCount) {
			let activePulseIndices = new Set();

			for (let index = 0; index < this._pulseDotNodes.length; index++) {
				let circle = this._pulseDotNodes[index];
				let pulseState = this._globePulseStates[index];
				let dotIndex = pulseState?.dotIndex;
				let dotVisible = Number.isInteger(dotIndex) && this._projectedDepth[dotIndex] > 0;
				let pulseEnded = pulseState ? (now - pulseState.startAt) >= pulseState.duration : true;

				if (!pulseState || !dotVisible || pulseEnded) {
					pulseState = this.createPulseState(now, visibleDotCount, activePulseIndices);
					this._globePulseStates[index] = pulseState;
					dotIndex = pulseState?.dotIndex;
					dotVisible = Number.isInteger(dotIndex) && this._projectedDepth[dotIndex] > 0;
				} else {
					activePulseIndices.add(dotIndex);
				}

				if (!pulseState || !dotVisible) {
					if (this._pulseDotVisible[index]) {
						circle.style.display = 'none';
						this._pulseDotVisible[index] = false;
					}

					continue;
				}

				let progress = Math.min((now - pulseState.startAt) / pulseState.duration, 1);
				let intensity = Math.sin(progress * Math.PI);
				let radius = this._projectedRadius[dotIndex] + 1.92 + (intensity * 2.56);
				let opacity = Math.min(.25 + (intensity * .8), 1);

				if (!this._pulseDotVisible[index]) {
					circle.style.display = '';
					this._pulseDotVisible[index] = true;
				}

				circle.cx.baseVal.value = this._projectedX[dotIndex];
				circle.cy.baseVal.value = this._projectedY[dotIndex];
				circle.r.baseVal.value = radius;
				circle.style.fillOpacity = opacity;
			}
		},
	};
</script>
