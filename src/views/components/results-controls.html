<div class="c-gp-results-controls">
	<div class="content-wrapper">
		<div class="content-wrapper_tabs {{#if targets && targets.length === 1}}single-target{{/if}} {{#unless rawOutputMode}}table-mode{{/unless}}">
			{{#each targets:idx}}
				<div on-click="@this.handleTabSwitch(idx)"
					class="content-wrapper_tabs_tab {{#if idx === activeTargetIdx && rawOutputMode}}active{{/if}} {{#unless rawOutputMode}}disabled{{/unless}}">
					<span class="content-wrapper_tabs_tab_text">{{this}}</span>
					<span class="active-tab-bar"></span>
				</div>
			{{/each}}
		</div>

		<div class="content-wrapper_ctrls">
			<div class="content-wrapper_ctrls_switch {{#if testType !== 'ping'}}content-wrapper_ctrls_switch--disabled{{/if}}" data-testid="results-display-switch">
				<input id="display-type" type="checkbox" aria-checked="{{rawOutputMode}}" checked="{{rawOutputMode}}" disabled="{{testType !== 'ping'}}" class="switch-input {{#if !rawOutputMode}}table{{/if}}">
				<label for="display-type">
					<span>
						<img width="16" height="16" alt="" src="{{@shared.assetsHost}}/img/raw-output-icon{{#if rawOutputMode}}.active{{/if}}.svg">
						List
					</span>
					<span>
						<img width="16" height="16" alt="" src="{{@shared.assetsHost}}/img/table-output-icon{{#unless rawOutputMode}}.active{{/unless}}.svg">
						Table
					</span>
				</label>
			</div>

			<button class="content-wrapper_ctrls_map-switch {{#if showMap}}content-wrapper_ctrls_map-switch--active{{/if}}"
				data-testid="map-switch"
				as-tooltip="showMap ? 'Hide map' : 'Show map'"
				aria-label="{{#if showMap}}Hide map{{else}}Show map{{/if}}"
				on-click="@this.set('originalShowMap', !showMap),@this.set('showMap', !showMap)">
				<img width="13" height="13" alt="" src="{{@shared.assetsHost}}/img/map-icon{{#if showMap}}.active{{/if}}.svg"/>
			</button>

			{{#if testType === 'ping'}}
				<div class="content-wrapper_ctrls_sort-options desktop-hidden dropdown">
					<div class="btn-group">
						<button type="button"
							class="dropdown-toggle content-wrapper_ctrls_btn"
							data-toggle="dropdown"
							aria-haspopup="true"
							aria-expanded="false">
							<img width="18" height="18" src="{{@shared.assetsHost}}/img/sort-{{sortOrder}}.svg">
						</button>

						<ul role="listbox" class="dropdown-menu dropdown-menu-right">
							{{#each sortByOpts}}
								<li role="option"
									aria-selected="{{sortBy === this.value}}"
									on-click="@this.onSortOptionSelect(this.value)"
									class="dropdown-item {{#if sortBy === this.value}}selected{{/if}}"
								>
									{{this.name}}
									{{#if sortBy === this.value}}
										<img width="9" src="{{@shared.assetsHost}}/img/sort-{{sortOrder}}-sm.svg">
									{{/if}}
								</li>
							{{/each}}
						</ul>
					</div>
				</div>
			{{/if}}

			{{#if allCollapsed}}
				<button class="content-wrapper_ctrls_collapse" disabled="{{!rawOutputMode}}" as-tooltip="'Expand all'" aria-label="Expand all" on-click="onExpandAll()">
					<i class="fa fa-chevron-down"></i>
					<i class="fa fa-chevron-down"></i>
				</button>
			{{else}}
				<button class="content-wrapper_ctrls_collapse" disabled="{{!rawOutputMode}}" as-tooltip="'Collapse all'" aria-label="Collapse all" on-click="onCollapseAll()">
					<i class="fa fa-chevron-up"></i>
					<i class="fa fa-chevron-up"></i>
				</button>
			{{/if}}
		</div>
	</div>
</div>

<script>
	const tooltip = require('../../assets/js/decorators/tooltip.js');

	component.exports = {
		decorators: {
			tooltip,
		},
		data () {
			return {
				onCollapseAll: () => null,
				onExpandAll: () => null,
				allCollapsed: false,
			};
		},
		handleTabSwitch (idx) {
			if (this.get('rawOutputMode')) {
				this.set('activeTargetIdx', idx);
			}
		},
		onSortOptionSelect (field) {
			if (this.get('sortBy') === field) {
				this.set('sortOrder', this.get('sortOrder') === 'asc' ? 'desc' : 'asc');
			} else {
				this.set('sortBy', field);
				this.set('sortOrder', 'asc');
			}

			return false;
		},
	};
</script>
