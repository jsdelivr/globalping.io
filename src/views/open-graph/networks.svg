<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g>
        <rect width="1200" height="600" fill="white"/>
        <image href="{{globeImage}}" x="654" y="55" width="546" height="545"/>
        <g>
            <g>
                {{#if logo}}
                    <image href="{{logo}}" x="88" y="88" width="84" height="84"/>
                {{/if}}
                <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="72" font-weight="600" letter-spacing="0.2px">
                    <tspan x="{{logo ? 204 : 88}}" y="{{logo ? 156 : 138}}">{{networkName}}</tspan>
                </text>
                {{#each subheaderFields}}
                    <g transform="translate(0,{{logo ? 0 : -32}})">
                        <rect x="{{ this.shift }}" y="198" width="{{ this.width }}" height="52" rx="15.5" stroke="#E7E7EE" fill="#fff"/>
                        {{#if this.name === 'probes'}}
                            <g transform="translate({{ this.shift + 16}},204)">
                                <path d="M19.9998 23.3332C21.8408 23.3332 23.3332 21.8408 23.3332 19.9998C23.3332 18.1589 21.8408 16.6665 19.9998 16.6665C18.1589 16.6665 16.6665 18.1589 16.6665 19.9998C16.6665 21.8408 18.1589 23.3332 19.9998 23.3332Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M27.0667 12.9335C27.9965 13.8622 28.734 14.9651 29.2373 16.1791C29.7405 17.393 29.9996 18.6943 29.9996 20.0085C29.9996 21.3226 29.7405 22.6239 29.2373 23.8379C28.734 25.0518 27.9965 26.1547 27.0667 27.0835M12.9334 27.0668C12.0036 26.1381 11.266 25.0352 10.7628 23.8212C10.2595 22.6072 10.0005 21.306 10.0005 19.9918C10.0005 18.6776 10.2595 17.3764 10.7628 16.1624C11.266 14.9484 12.0036 13.8455 12.9334 12.9168M31.7834 8.2168C34.9079 11.3423 36.6631 15.5807 36.6631 20.0001C36.6631 24.4195 34.9079 28.658 31.7834 31.7835M8.21669 31.7835C5.09217 28.658 3.33691 24.4195 3.33691 20.0001C3.33691 15.5807 5.09217 11.3423 8.21669 8.2168" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        {{elseif this.name === 'cities'}}
                            <g transform="translate({{this.shift + 16}},204)">
                                <path d="M24.7923 24.4102H12.3198V32.0002H24.7923V24.4102Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M20.2923 32H7.81982V8H20.2923V24.455" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M32.18 16.5127H24.7925V32.0002H32.18V16.5127Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M28.025 16.5123V13.4448L24.1625 10.9023L20.2925 13.5798" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17.0034 13H16.0034V14H17.0034V13Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12.0034 13H11.0034V14H12.0034V13Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17.0034 19H16.0034V20H17.0034V19Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12.0034 19H11.0034V20H12.0034V19Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M17.0034 28H16.0034V29H17.0034V28Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M21.0034 28H20.0034V29H21.0034V28Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M32 20H28V21H32V20Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M32 25H28V26H32V25Z" stroke="#17233A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        {{else}}
                            <g transform="translate({{this.shift + 16}},204)">
                                <path d="M20.2321 30.8827C26.2424 30.8827 31.1146 26.0104 31.1146 20.0002C31.1146 13.9899 26.2424 9.11768 20.2321 9.11768C14.2219 9.11768 9.34961 13.9899 9.34961 20.0002C9.34961 26.0104 14.2219 30.8827 20.2321 30.8827Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M20.2325 30.8827C22.8462 30.8827 24.965 26.0104 24.965 20.0002C24.965 13.9899 22.8462 9.11768 20.2325 9.11768C17.6188 9.11768 15.5 13.9899 15.5 20.0002C15.5 26.0104 17.6188 30.8827 20.2325 30.8827Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M10.0024 16.2798H30.1699" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M10.0024 23.7725H30.1699" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M24.9647 17.3976C25.5818 17.3976 26.0822 16.8973 26.0822 16.2801C26.0822 15.6629 25.5818 15.1626 24.9647 15.1626C24.3475 15.1626 23.8472 15.6629 23.8472 16.2801C23.8472 16.8973 24.3475 17.3976 24.9647 17.3976Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M20.2322 32.0001C20.8494 32.0001 21.3497 31.4998 21.3497 30.8826C21.3497 30.2655 20.8494 29.7651 20.2322 29.7651C19.6151 29.7651 19.1147 30.2655 19.1147 30.8826C19.1147 31.4998 19.6151 32.0001 20.2322 32.0001Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M15.8446 24.8898C16.4617 24.8898 16.9621 24.3895 16.9621 23.7723C16.9621 23.1551 16.4617 22.6548 15.8446 22.6548C15.2274 22.6548 14.7271 23.1551 14.7271 23.7723C14.7271 24.3895 15.2274 24.8898 15.8446 24.8898Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M20.2322 10.235C20.8494 10.235 21.3497 9.73468 21.3497 9.1175C21.3497 8.50032 20.8494 8 20.2322 8C19.6151 8 19.1147 8.50032 19.1147 9.1175C19.1147 9.73468 19.6151 10.235 20.2322 10.235Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                                <path d="M10.0023 17.3976C10.6194 17.3976 11.1198 16.8973 11.1198 16.2801C11.1198 15.6629 10.6194 15.1626 10.0023 15.1626C9.38509 15.1626 8.88477 15.6629 8.88477 16.2801C8.88477 16.8973 9.38509 17.3976 10.0023 17.3976Z" stroke="#17233A" stroke-width="2" stroke-miterlimit="10"/>
                            </g>
                        {{/if}}
                        <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="600" letter-spacing="0.2px"><tspan x="{{this.shift + 68}}" y="234">{{this.count}}</tspan></text>
                        <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="400" letter-spacing="0.2px"><tspan x="{{this.shift + 68 + this.countWidth + 12}}" y="234">{{this.title}}</tspan></text>
                    </g>
                {{/each}}
            </g>
        </g>
        <g transform="translate(0,{{continentsSecondRow.length ? -76 : 0}})">
            <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="400" letter-spacing="0"><tspan x="88" y="426">Probes by continent:</tspan></text>
            <g>
                {{#each continentsFirstRow}}
                    <g transform="translate({{this.shift}},0)">
                        <rect x="0" y="451" width="{{ this.width }}" height="60" rx="15.5" stroke="#E7E7EE" fill="#fff"/>
                        <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="600" letter-spacing="0.2"><tspan x="16" y="491">{{this.name}}</tspan></text>
                        <text fill="#9B9BA6" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="400" letter-spacing="-0.6"><tspan x="{{26 + this.textWidth}}" y="491">({{this.count}})</tspan></text>
                    </g>
                {{/each}}
            </g>
            <g>
                {{#each continentsSecondRow}}
                    <g transform="translate({{this.shift}},76)">
                        <rect x="0" y="451" width="{{ this.width }}" height="60" rx="15.5" stroke="#E7E7EE" fill="#fff"/>
                        <text fill="#17233B" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="600" letter-spacing="0.2"><tspan x="16" y="491">{{this.name}}</tspan></text>
                        <text fill="#9B9BA6" xml:space="preserve" style="white-space: pre" font-family="Lexend" font-size="32" font-weight="400" letter-spacing="-0.6"><tspan x="{{26 + this.textWidth}}" y="491">({{this.count}})</tspan></text>
                    </g>
                {{/each}}
            </g>
        </g>
    </g>
</svg>
